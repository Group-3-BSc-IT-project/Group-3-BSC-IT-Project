<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Service — MSBMS</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --navy: #17233d;
  --muted: #8f929a;
  --blue: #2563eb;
  --blue-light: #f1f5ff;
  --border: #e0e2e7;
  --background: #f5f6fa;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 24px;
  color: var(--navy);
  background: var(--background);
  font-family: Arial, Helvetica, sans-serif;
}

.booking-card {
  width: min(1200px, 100%);
  min-height: 540px;
  margin: 0 auto;
  padding: 44px 40px 40px;
  background: #ffffff;
  border: 1px solid #e6e7eb;
  border-radius: 16px;
  box-shadow: 0 4px 14px rgba(23, 35, 61, 0.04);
}

h1 {
  margin: 0 0 42px;
  font-size: 32px;
  line-height: 1.2;
  letter-spacing: -0.5px;
}

.progress-steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin: 0 0 50px;
  padding: 0;
  list-style: none;
}

.step {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 16px;
  text-align: center;
}

.step:not(:last-child)::after {
  position: absolute;
  top: 20px;
  left: calc(50% + 42px);
  width: calc(100% - 84px);
  height: 2px;
  background: #e1e2e5;
  content: "";
}

.step-number {
  position: relative;
  z-index: 1;
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  color: var(--muted);
  background: #ffffff;
  border: 2px solid #d9dadd;
  border-radius: 50%;
  font-size: 16px;
}

.step.active {
  color: var(--blue);
}

.step.active .step-number {
  color: #ffffff;
  background: var(--blue);
  border-color: var(--blue);
}

fieldset {
  margin: 0;
  padding: 0;
  border: 0;
}

legend {
  margin-bottom: 20px;
  padding: 0;
  color: var(--navy);
  font-size: 20px;
  font-weight: 700;
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.service-card {
  position: relative;
  display: flex;
  align-items: center;
  min-height: 96px;
  padding: 20px 24px;
  color: var(--navy);
  background: #ffffff;
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 2px 0 rgba(23, 35, 61, 0.03);
  transition: border-color 0.2s ease, background-color 0.2s ease,
    box-shadow 0.2s ease, transform 0.15s ease;
}

.service-card:hover {
  border-color: #8fa8df;
  background: #f8faff;
  box-shadow: 0 4px 10px rgba(23, 35, 61, 0.08);
  transform: translateY(-1px);
}

.service-card:has(input:checked) {
  color: #ffffff;
  background: var(--blue);
  border-color: var(--blue);
  box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
}

.service-card input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

.radio-control {
  display: none;
}

.service-card input:checked ~ .service-content strong,
.service-card input:checked ~ .service-content small {
  color: #ffffff;
}

.service-card:has(input:focus-visible) {
  outline: 3px solid rgba(37, 99, 235, 0.35);
  outline-offset: 3px;
}

.service-content {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.service-content strong {
  font-size: 16px;
  line-height: 1.25;
}

.service-content small {
  color: var(--muted);
  font-size: 14px;
}

.service-card:active {
  transform: translateY(0);
}

.navigation-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 40px;
}

.btn {
  min-width: 92px;
  padding: 12px 22px;
  border-radius: 8px;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s ease, border-color 0.2s ease,
    box-shadow 0.2s ease;
}

.btn-back {
  color: var(--navy);
  background: #ffffff;
  border: 1px solid #d9dee8;
}

.btn-back:hover {
  background: #f5f7fa;
  border-color: #c4cad6;
}

.btn-next {
  color: #ffffff;
  background: var(--blue);
  border: 1px solid var(--blue);
  box-shadow: 0 2px 5px rgba(37, 99, 235, 0.2);
}

.btn-next:hover {
  background: #1d4ed8;
  border-color: #1d4ed8;
}

.btn:focus-visible {
  outline: 3px solid rgba(37, 99, 235, 0.35);
  outline-offset: 2px;
}

@media (max-width: 800px) {
  .booking-card {
    padding: 32px 24px;
  }

  .service-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 560px) {
  body {
    padding: 12px;
  }

  .booking-card {
    padding: 28px 18px;
  }

  h1 {
    margin-bottom: 32px;
    font-size: 28px;
  }

  .progress-steps {
    margin-bottom: 36px;
  }

  .step {
    gap: 8px;
    font-size: 12px;
  }

  .step-number {
    width: 34px;
    height: 34px;
    font-size: 14px;
  }

  .step:not(:last-child)::after {
    top: 16px;
    left: calc(50% + 30px);
    width: calc(100% - 60px);
  }

  .service-grid {
    grid-template-columns: 1fr;
  }

  .navigation-buttons {
    margin-top: 28px;
  }
}


</style>
</head>
<body>

   <main class="booking-card">
    <h1>Book a Service</h1>

    <ol class="progress-steps" aria-label="Booking progress">
      <li class="step active">
        <span class="step-number">1</span>
        <span>Select Service</span>
      </li>
      <li class="step">
        <span class="step-number">2</span>
        <span>Select Date &amp; Time</span>
      </li>
      <li class="step">
        <span class="step-number">3</span>
        <span>Your Details</span>
      </li>
      <li class="step">
        <span class="step-number">4</span>
        <span>Confirm</span>
      </li>
    </ol>

    <form id="service-form">
      <fieldset>
        <legend>Select a Service</legend>

        <div class="service-grid">
          <label class="service-card">
            <input type="radio" name="service" value="oil-change" checked />
            <span class="radio-control" aria-hidden="true"></span>
            <span class="service-content">
              <strong>Oil Change &amp; Filter</strong>
              <small>From R499</small>
            </span>
          </label>

          <label class="service-card">
            <input type="radio" name="service" value="brake-inspection" />
            <span class="radio-control" aria-hidden="true"></span>
            <span class="service-content">
              <strong>Brake Inspection</strong>
              <small>From R399</small>
            </span>
          </label>

          <label class="service-card">
            <input type="radio" name="service" value="full-service" />
            <span class="radio-control" aria-hidden="true"></span>
            <span class="service-content">
              <strong>Full Service</strong>
              <small>From R1299</small>
            </span>
          </label>

          <label class="service-card">
            <input type="radio" name="service" value="engine-diagnostics" />
            <span class="radio-control" aria-hidden="true"></span>
            <span class="service-content">
              <strong>Engine Diagnostics</strong>
              <small>From R599</small>
            </span>
          </label>

          <label class="service-card">
            <input type="radio" name="service" value="tyre-replacement" />
            <span class="radio-control" aria-hidden="true"></span>
            <span class="service-content">
              <strong>Tyre Replacement</strong>
              <small>From R450</small>
            </span>
          </label>

          <label class="service-card">
            <input type="radio" name="service" value="battery-check" />
            <span class="radio-control" aria-hidden="true"></span>
            <span class="service-content">
              <strong>Battery Check</strong>
              <small>From R199</small>
            </span>
          </label>
        </div>
      </fieldset>

      <div class="navigation-buttons">
        <button type="button" class="btn btn-back">
          <a href="my-bookings.html">Back</a>
        </button>
        <button type="submit" class="btn btn-next">
          <a href="step2-date-time.html">Next</a>
        </button>
      </div>
    </form>
  </main>

  <script>
    document.querySelector('#service-form').addEventListener('submit', function (event) {
      event.preventDefault();

      const selectedService = document.querySelector('input[name="service"]:checked');
      console.log('Selected service:', selectedService.value);
    });
  </script>
</body>
</html>
