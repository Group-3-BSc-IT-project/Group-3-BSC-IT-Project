<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Service — Your Details</title>
<style>
  :root {
    --navy: #10172a;
    --blue: #2f5bea;
    --blue-light: #eef2ff;
    --green: #22b573;
    --text-dark: #16192b;
    --text-muted: #9aa0b0;
    --text-step: #8b90a0;
    --border: #e7e9f0;
    --bg: #f5f6fa;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
  }
  .page {
    max-width: 960px;
    margin: 40px auto;
    background: var(--white);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(16, 23, 42, 0.04);
    padding: 32px;
  }
  h1 { margin: 0 0 32px 0; font-size: 26px; font-weight: 700; }

  /* Stepper */
  .stepper { display: flex; align-items: flex-start; margin-bottom: 36px; padding: 0 8px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 180px; }
  .step-circle {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    background: var(--white); border: 2px solid #d7dae3; color: var(--text-step); z-index: 1;
  }
  .step.done .step-circle { background: var(--green); border-color: var(--green); color: var(--white); }
  .step.active .step-circle { background: var(--blue); border-color: var(--blue); color: var(--white); }
  .step-label { font-size: 13px; color: var(--text-step); white-space: nowrap; }
  .step.done .step-label { color: var(--text-dark); font-weight: 600; }
  .step.active .step-label { color: var(--blue); font-weight: 600; }
  .step-connector { flex: 1 1 auto; height: 2px; background: #e2e4ec; margin-top: 15px; margin-left: -16px; margin-right: -16px; }

  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; }

  form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text-dark); display: flex; justify-content: space-between; }
  .field .add-vehicle { color: var(--blue); font-weight: 600; cursor: pointer; }
  .field input, .field select, .field textarea {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; color: var(--text-dark); background: var(--white);
  }
  .field input::placeholder, .field textarea::placeholder { color: #b7bac6; }
  .field textarea { resize: vertical; min-height: 80px; }
  .field select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239aa0b0'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; }

  .actions { display: flex; justify-content: space-between; margin-top: 28px; }
  .btn {
    padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); font-family: inherit;
  }
  .btn-back { background: var(--white); color: var(--text-dark); }
  .btn-next { background: var(--blue); color: var(--white); border-color: var(--blue); }

  @media (max-width: 700px) {
    .page { margin: 0; border-radius: 0; padding: 20px; }
    form { grid-template-columns: 1fr; }
    .stepper { overflow-x: auto; }
    .step { width: 130px; }
    .step-label { font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="page">
    <h1>Book a Service</h1>

    <div class="stepper">
      <div class="step done"><div class="step-circle">✓</div><div class="step-label">Select Service</div></div>
      <div class="step-connector"></div>
      <div class="step done"><div class="step-circle">✓</div><div class="step-label">Select Date &amp; Time</div></div>
      <div class="step-connector"></div>
      <div class="step active"><div class="step-circle">3</div><div class="step-label">Your Details</div></div>
      <div class="step-connector"></div>
      <div class="step"><div class="step-circle">4</div><div class="step-label">Confirm</div></div>
    </div>

    <div class="section-title">Your Details</div>

    <form>
      <div class="field">
        <label>Vehicle <span class="add-vehicle">+ Add New Vehicle</span></label>
        <select>
          <option>Toyota Corolla (ABC123GP)</option>
          <option>Honda Civic (XYZ789GP)</option>
          <option>BMW 320i (CAA456GP)</option>
        </select>
      </div>
      <div class="field">
        <label>Full Name</label>
        <input type="text" value="John Doe">
      </div>

      <div class="field">
        <label>Phone Number</label>
        <input type="text" value="083 123 4567">
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" value="john.doe@email.com">
      </div>

      <div class="field full">
        <label>Additional Notes (Optional)</label>
        <textarea placeholder="Any special requests or information?"></textarea>
      </div>
    </form>

    <div class="actions">
      <button class="btn btn-back"><a href="step2-date-time.html">Back</a></button>
      <button class="btn btn-next"><a href="step4-confirm.html">Next</a></button>
    </div>
  </div>
</body>
</html>
